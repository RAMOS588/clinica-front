<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalis Web — Catálogo</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header id="navbar"></header>

    <main>
        <h1>Catálogo de servicios</h1>

        <section class="filtros">
            <input type="text" id="busqueda" placeholder="Buscar por nombre o descripción...">
            <select id="filtroEspecialidad">
                <option value="">Todas las especialidades</option>
            </select>
            <select id="filtroSede">
                <option value="">Todas las sedes</option>
            </select>
            <select id="filtroTipo">
                <option value="">Todos los tipos</option>
                <option value="consulta">Consulta</option>
                <option value="paquete">Paquete</option>
                <option value="procedimiento">Procedimiento</option>
            </select>
        </section>

        <section id="listaProductos" class="grid-3"></section>
    </main>

    <footer>
        <p>© 2026 Clínica Vitalis</p>
    </footer>

    <script type="module" src="js/pages/catalogo.js"></script>
</body>
</html>
