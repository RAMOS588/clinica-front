<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalis Web — Carrito</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header id="navbar"></header>

    <main>
        <h1>Carrito de atenciones</h1>
        <section id="listaCarrito" class="lista-carrito"></section>

        <h2>Registrar cita</h2>
        <form id="formCita" class="form-cita">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="text" name="documento" placeholder="Documento de identidad" required>
            <input type="text" name="telefono" placeholder="Teléfono" required>
            <select name="productoId" id="selectProducto" required></select>
            <select name="medicoId" id="selectMedico" required></select>
            <select name="sedeId" id="selectSede" required></select>
            <input type="date" name="fecha" required>
            <input type="time" name="hora" required>
            <button type="submit" class="btn-primario">Registrar cita</button>
        </form>

        <div id="mensajeCita"></div>
    </main>

    <footer>
        <p>© 2026 Clínica Vitalis</p>
    </footer>

    <script type="module" src="js/pages/carrito.js"></script>
</body>
</html>
